name: Screenshots

# Runs the unit tests and renders the main screens to PNG (Robolectric, native graphics) so changes can be
# reviewed without a phone. Runs on branches other than main. PNGs and the Gradle log go to the orphan branch
# "shots" (force-pushed): git can reach it from any review environment, unlike Actions logs and artifacts.
on:
  push:
    branches-ignore: [main, shots, ci-log]
    paths-ignore:
      - "**.md"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Unit tests and screenshots
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Publish to shots branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp app/build/shots/*.png /tmp/shots/ 2>/dev/null || true
          cp /tmp/gradle.log /tmp/shots/gradle.log 2>/dev/null || true
          mkdir -p /tmp/shots/tests && cp app/build/test-results/testDebugUnitTest/*.xml /tmp/shots/tests/ 2>/dev/null || true
          cd /tmp/shots
          echo "${{ github.sha }}" > SHA
          git init -q -b shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots
